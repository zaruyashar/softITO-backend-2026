<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikroservis Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 600;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: -webkit-linear-gradient(#60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            flex: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            margin-top: 0;
            font-weight: 400;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.1s ease;
            width: 100%;
            margin-top: 1rem;
        }
        button:hover {
            background: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        .item-list {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }
        .item-info strong {
            display: block;
            font-size: 1.1rem;
        }
        .item-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            width: auto;
            margin: 0;
            padding: 0.5rem 1rem;
        }
        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>🚀 Mikroservis Yönetim Paneli</h1>

    <div class="container">
        <!-- ÜRÜNLER KARTI -->
        <div class="card">
            <h2>📦 Ürünler Servisi</h2>
            <div class="form-group">
                <input type="text" id="pName" placeholder="Ürün Adı (Örn: Laptop)">
                <input type="number" id="pPrice" placeholder="Fiyat (Örn: 25000)">
                <input type="number" id="pStock" placeholder="Stok Adedi (Örn: 10)">
            </div>
            <button onclick="addProduct()">Ürün Ekle</button>
            <div class="item-list" id="productList"></div>
        </div>

        <!-- MÜŞTERİLER KARTI -->
        <div class="card">
            <h2>👥 Müşteriler Servisi</h2>
            <div class="form-group">
                <input type="text" id="cFirst" placeholder="Ad (Örn: Ahmet)">
                <input type="text" id="cLast" placeholder="Soyad (Örn: Yılmaz)">
            </div>
            <button onclick="addCustomer()">Müşteri Ekle</button>
            <div class="item-list" id="customerList"></div>
        </div>
    </div>

    <script>
        // Tüm istekler API Gateway'e (5000 portuna) atılıyor!
        const GATEWAY_URL = 'http://localhost:5000/gateway';

        // --- PRODUCTS ---
        async function loadProducts() {
            try {
                const res = await fetch(`${GATEWAY_URL}/products`);
                if (!res.ok) throw new Error("Ağ hatası veya CORS problemi");
                const data = await res.json();
                const list = document.getElementById('productList');
                list.innerHTML = '';
                data.forEach(p => {
                    list.innerHTML += `
                        <div class="item">
                            <div class="item-info">
                                <strong>${p.name}</strong>
                                <span>Fiyat: ${p.price}₺ | Stok: ${p.stock}</span>
                            </div>
                            <button class="delete-btn" onclick="deleteProduct(${p.id})">Sil</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('API Error:', err);
                document.getElementById('productList').innerHTML = '<span style="color:#ef4444">Veri çekilemedi. Lütfen Visual Studio projelerinin çalıştığından ve CORS ayarının yapıldığından emin olun.</span>';
            }
        }

        async function addProduct() {
            const name = document.getElementById('pName').value;
            const price = parseFloat(document.getElementById('pPrice').value) || 0;
            const stock = parseInt(document.getElementById('pStock').value) || 0;
            
            if(!name) return alert("Lütfen ürün ismini girin.");

            await fetch(`${GATEWAY_URL}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, stock })
            });
            
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '';
            loadProducts();
        }

        async function deleteProduct(id) {
            await fetch(`${GATEWAY_URL}/products/${id}`, { method: 'DELETE' });
            loadProducts();
        }

        // --- CUSTOMERS ---
        async function loadCustomers() {
            try {
                const res = await fetch(`${GATEWAY_URL}/customers`);
                if (!res.ok) throw new Error("Ağ hatası veya CORS problemi");
                const data = await res.json();
                const list = document.getElementById('customerList');
                list.innerHTML = '';
                data.forEach(c => {
                    list.innerHTML += `
                        <div class="item">
                            <div class="item-info">
                                <strong>${c.firstName} ${c.lastName}</strong>
                            </div>
                            <button class="delete-btn" onclick="deleteCustomer(${c.id})">Sil</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('API Error:', err);
                document.getElementById('customerList').innerHTML = '<span style="color:#ef4444">Veri çekilemedi.</span>';
            }
        }

        async function addCustomer() {
            const firstName = document.getElementById('cFirst').value;
            const lastName = document.getElementById('cLast').value;
            
            if(!firstName) return alert("Lütfen ad girin.");

            await fetch(`${GATEWAY_URL}/customers`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName })
            });
            
            document.getElementById('cFirst').value = '';
            document.getElementById('cLast').value = '';
            loadCustomers();
        }

        async function deleteCustomer(id) {
            await fetch(`${GATEWAY_URL}/customers/${id}`, { method: 'DELETE' });
            loadCustomers();
        }

        // Sayfa yüklendiğinde verileri çek
        loadProducts();
        loadCustomers();
    </script>
</body>
</html>
