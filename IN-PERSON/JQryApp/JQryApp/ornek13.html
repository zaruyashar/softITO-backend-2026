<html>
<head>
    <title>
    </title>
    <script src="lib/jquery-3.4.0.slim.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        //2 tane buton olacak. Birisi arttırma butonu diğeri de azaltma butonu
        //div içerisindeki sayıları arttırıp azaltsın.
        $(document).ready(function () {
            var sayi = 0; $("#kutu").text(sayi);
            $("#btn1").click(function () { sayi--; $("#kutu").html(sayi); })
            $("#btn2").click(function () { sayi++; $("#kutu").html(sayi); })
        });
    </script>
    <style>
        div {
            background-color: red;
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div id="kutu"></div>    
    <br>    
    <button id="btn1">Azalt</button>    
    <button id="btn2">Arttır</button>
</body>
</html>
